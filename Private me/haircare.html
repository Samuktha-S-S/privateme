<!DOCTYPE html>

<body>
  <div class="container">
    <h1>Magical Haircare 🌸</h1>
    <div class="card">
      <h2>💆‍♀️ Hair Massage</h2>
      <ul>
        <li>Massage scalp with coconut oil for 10-15 mins</li>
        <li>Leave it for 2-3 hours before washing</li>
      </ul>
    </div>
    <div class="card">
      <h2>🧴 Shampoo Must Contain</h2>
      <ul>
        <li>Sulfate-free ingredients</li>
        <li>Biotin for strength</li>
        <li>Keratin for smoothness</li>
      </ul>
    </div>
  </div>
</body>
